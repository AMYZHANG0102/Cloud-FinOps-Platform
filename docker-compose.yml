services:
  floci:
    image: floci/floci:latest
    container_name: finops-floci
    ports:
      - "4566:4566"
    environment:
      - FLOCI_HOSTNAME=localhost
      - FLOCI_BASE_URL=http://localhost:4566
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_STORAGE_PERSISTENT_PATH=/app/data
    volumes:
      - floci-data:/app/data
    restart: unless-stopped

volumes:
  floci-data:
    name: finops-floci-data
